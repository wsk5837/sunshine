services:
  - type: web
    name: trm-tech-resource-poc
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: TRM_DB_PATH
        value: /tmp/trm_system.db
      - key: TRM_UPLOAD_DIR
        value: /tmp/trm_uploads
