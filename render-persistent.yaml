services:
  - type: web
    name: trm-tech-resource-poc
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: trm-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: TRM_DB_PATH
        value: /var/data/trm_system.db
      - key: TRM_UPLOAD_DIR
        value: /var/data/uploads
      - key: TRM_MCP_API_TOKEN
        sync: false
      - key: TRM_MCP_WRITE_ENABLED
        value: "false"
      - key: TRM_MCP_ALLOWED_ORIGINS
        value: https://adk.gazellio.com
