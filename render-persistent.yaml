# 备选方案：此文件需要 Render Starter 付费实例和 Persistent Disk。
# 免费 Render + Neon PostgreSQL 试点请直接使用 render.yaml。
services:
  - type: web
    name: trm-tech-resource-poc
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.runtime:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: trm-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: TRM_DB_PATH
        value: /var/data/trm_system.db
      - key: TRM_UPLOAD_DIR
        value: /var/data/uploads
      - key: TRM_TAPD_MODE
        value: live
      - key: TRM_TAPD_WORKSPACE_ID
        sync: false
      - key: TRM_TAPD_BASE_URL
        value: https://api.tapd.cn
      - key: TRM_TAPD_API_USER
        sync: false
      - key: TRM_TAPD_API_PASSWORD
        sync: false
      - key: TRM_TAPD_WEBHOOK_SECRET
        sync: false
      - key: TRM_MCP_API_TOKEN
        sync: false
      - key: TRM_MCP_WRITE_ENABLED
        value: "false"
      - key: TRM_MCP_ALLOWED_ORIGINS
        value: https://adk.gazellio.com
